databases:
  - name: space-db
    plan: free
    databaseName: space
    user: space

services:
  - type: web
    name: space
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: space-db
          property: connectionString
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
